<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <script>
      // iOS Safari auto-zooms focused inputs under 16px. maximum-scale=1
      // stops that zoom; pinch-zoom still works on iOS 10+. Keep Android alone
      // so accessibility zoom is not blocked there.
      (function () {
        var ua = navigator.userAgent;
        var iOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (!iOS) return;
        var vp = document.querySelector('meta[name="viewport"]');
        if (vp) {
          vp.setAttribute(
            "content",
            "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover",
          );
        }
      })();
    </script>
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="cursor-bridge" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="Browser UI for sending prompts to a local Cursor agent. Use the Prompt form on this page — not MCP."
    />
    <title>cursor-bridge — Agent console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
